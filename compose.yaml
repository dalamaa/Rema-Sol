name: remasol-hackathon

services:
  remasol:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: "5007"
      REMA_SOL_DATABASE: /var/lib/remasol/remasol.sqlite3
      REMA_SOL_COOKIE_SECURE: "1"
      REMA_SOL_TRUST_PROXY: "1"
      FLASK_DEBUG: "0"
    ports:
      - "127.0.0.1:8507:5007"
    volumes:
      - type: bind
        source: ./data
        target: /var/lib/remasol
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5007/', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
